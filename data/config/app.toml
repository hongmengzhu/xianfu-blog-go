# gin 引擎已由 echo 内部兜底调用，不再独立监听端口；
# 如需恢复 gin 独立服务（并引入 starter-gin），再配置 spring.gin.server.addr
[spring.gin.server]
addr = ":9981"

[spring.echo.server]
# 端口
addr = ":9985"
enabled = true

# 业务域名（非 server 配置）
[server]
# 不带 / 后缀
domain = "http://localhost:9981"


[spring.governance.source.file]
path = "data/config/governance.toml"

# 数据库
[database]
# 是否启用
enabled = true
# 数据库类型
driver = "postgres"
# gorm SQL 日志级别：silent / error / warn / info（info 即 debug，逐条输出 SQL）。
# 留空则不覆盖框架默认（只打印慢查询与错误）；输出走日志系统，需根 logger 为 DEBUG 才可见。
log-level = "debug"

# 数据库
[spring.gorm.postgres.instances.primary]
host = "127.0.0.1"
port = 5432
user = "postgres"
password = "postgres"
db = "test-make-01"
sslmode = "disable"
timezone = "Asia/Shanghai"
# connectTimeout = 60
[spring2.gorm.sqlite.instances.primary]
# file = :memory:
file = "./data/blog.db"

journal-mode = "wal"
busy-timeou = 5000
foreign-keys =  true
max-open-conns = 8


# 域模块
[pg.domain]
#  系统后台启用
system = true

#后台管理员
[pg.jwt.admin]
secret = "s1s1ssssaaa234324324324dsfdfs"
# 过期时间，单位 分钟 1440:1天
expire = 991440

#前台用户
[pg.jwt.user]
secret = "b2bb2bbbbbb234324324324dsfdfs"
# 过期时间，单位 分钟
expire = 991440

#前台用户
[pg.jwt.web]
secret = "b3bbb3bbbbb234324324324dsfdfs"
# 过期时间，单位 分钟
expire = 991440
# cookie 是否开启
cookieOn = true


#数据
[pg.data]
#点击删除时是否直接删除
delete = true
#注册参数
# 身份编号，例如身份证号
[pg.register.identityCode]
#必填
required = false
#租户下唯一
unique = false

[pg.profiles]
active = "dev"
include = []

[pg.multiTenant]
contain = []
not = []
[pg.multi.tenant]
contain = []
not = []
[pg.multi.org]
contain = []
not = []
[pg.multi.merchant]
contain = []
not = []
[pg.multi.store]
contain = []
not = []
[pg.multi.owner]
contain = []
not = []

[pg.attachment]
# file system
dir = "attachment"
# 创建目录权限代号
mkdirPermission = 777
# 附件存储域名 不带 / 后缀
domain = ""
[pg.attachment.minio]
# minio
minio.enable = false
minio.host = "127.0.0.1"
minio.port = 9000
minio.access = ""
minio.secret = ""
minio.secure = false
minio.bucket = "gs-demo"

# 进程内缓存（starter-bigcache），已替代原 Redis。
# spring.bigcache.default 是家族默认值，instances.<name> 没写的键都从这里继承。
[spring.bigcache.default]
# 分片数决定并发度，也决定单条上限：hard-max-cache-size / shards。
shards = 64
# 实例级 life-window：只决定条目何时算“陈旧”，逐条 TTL 由 rdsPg.BatchString 的值信封负责。
life-window = "720h"
# 0 表示不启动后台按龄清理；过期条目由读路径隐藏，内存靠 hard-max-cache-size 兜底。
clean-window = "0s"
# 这两个值只影响启动时的预分配，不是上限：
#   BytesQueue 初始容量 = min(max-entries-in-window/shards * max-entry-size, hard-max-cache-size/shards)
#   按下面取值约 12MB 起步，之后按需增长到 hard-max-cache-size。
max-entries-in-window = 24000
max-entry-size = 1024
# 总内存上限 256MB；单条上限 = 256MB/64 = 4MB，超过的文章会写失败（回落到数据库）。
hard-max-cache-size = 256
stats-enabled = true

[spring.bigcache.instances.app]
# 选用 pkg/cachePg/bigCachePg 注册的 longterm Driver：
# 要求 life-window >= 24h、clean-window = 0、必须设置内存上限，正好匹配“常驻读缓存”的定位。
driver = "longterm"
life-window = "720h"

[mail]
host = "127.0.0.1"
port = 12345
username = ""
authCode = ""
smtpAuth = ""
from = ""
[pg.rocketmq]
nameServers = ["127.0.0.1:9876"]

# 目录
[pg.directory]
# 数据文件目录，静态文件
data = "data"

# 模版 主题
[pg.template]
# 主题名称
theme = "nisarg"
# 后缀 例如 .html
suffix = ".html"

[pg.template.vhost.blog]
theme = "blog"
[pg.template.vhost.bookmark]
theme = "bookmark"

[pg.auth.loginEncrypt]
# 默认加密
default = true

# ================== 日志配置 ==================
# go-spring 只读取 logging.* 前缀下的配置（前缀在加载时会被剥离），
# 因此 logger/appender 必须写成 logging.logger.* 和 logging.appender.* 这两类键；
# 写成顶层的 logger.root / appender.console 不会被加载，级别会退回框架默认的 INFO。
# 根日志器：DEBUG 级别，同时输出到控制台和文件
[logging.logger.root]
type = "Logger"
level = "DEBUG"

[[logging.logger.root.appenderRef]]
ref = "console"

[[logging.logger.root.appenderRef]]
ref = "file"

# 控制台输出器
[logging.appender.console]
type = "ConsoleAppender"

[logging.appender.console.layout]
type = "TextLayout"

# 文件输出器
[logging.appender.file]
type = "FileAppender"
dir = "./data/logs"
file = "app.log"

[logging.appender.file.layout]
type = "JSONLayout"
