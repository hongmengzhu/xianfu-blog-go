{{ define "nav/tool/category-main.html" }}
<main class="page-main">
    <div class="wrap">
        <nav class="breadcrumb-line" aria-label="面包屑">
            <a href="/">首页</a><svg class="icon icon-sm" aria-hidden="true"><use href="/assets/static/nav-001/icons.svg#chevron-right"></use></svg><span class="current">工具库</span>
        </nav>
        <section class="page-hero">
            <div class="page-hero-inner">
                <div class="page-hero-copy">
                    <h1>工具库</h1>
                    <p>按分类浏览 AI 应用与工具，点击分类可查看该分类下的全部工具</p>
                </div>
                <div class="page-hero-stats">
                    <div class="page-stat"><strong>{{if .dataIs}}{{len .data}}{{else}}0{{end}}</strong><span>个分类</span></div>
                </div>
            </div>
        </section>

        <div class="subcats" style="margin-bottom:22px">
            <span class="subcats-label">快速定位：</span>
            {{if .dataIs}}
            {{range $g := .data}}
            <a class="chip" href="/category/{{$g.Code}}">{{$g.Name}}</a>
            {{end}}
            {{end}}
        </div>

        {{template "nav/tool/category-sections.html" .}}
    </div>
</main>
{{end}}
