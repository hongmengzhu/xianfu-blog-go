{{ define "nav/tool/header.html" }}<!DOCTYPE html>
<html lang="zh-CN" class="h-full antialiased dark" data-theme="light" data-bs-theme="light">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="profile" href="http://gmpg.org/xfn/11" />
	<title>{{if .sitePage.Title}}{{.sitePage.Title}}{{else}}分宝呀工具{{end}}</title>
	<meta name="description" content="{{.sitePage.Description}}" />
	<meta name="keywords" content="{{.sitePage.Keywords}}" />
	<meta name="robots" content="max-image-preview:large" />
	{{if .sitePage.SiteUrl}}<link rel="canonical" href="{{.sitePage.SiteUrl}}{{.ctxRequest.Path}}" />{{end}}
	<meta name="theme-color" content="#050609">
	<meta property="og:locale" content="zh_CN" />
	<meta property="og:site_name" content="{{if .sitePage.SiteName}}{{.sitePage.SiteName}}{{else}}分宝呀{{end}}" />
	<meta property="og:type" content="website" />
	<meta property="og:title" content="{{.sitePage.Title}}" />
	<meta property="og:description" content="{{.sitePage.Description}}" />
	<meta property="og:url" content="{{.sitePage.SiteUrl}}{{.ctxRequest.Path}}" />
	<meta property="og:image" content="{{if .sitePage.SiteLogo}}{{.sitePage.SiteLogo}}{{else}}/assets/static/nav-001/img/icon.png{{end}}" />
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="{{.sitePage.Title}}" />
	<meta name="twitter:description" content="{{.sitePage.Description}}" />
	<meta name="twitter:image" content="{{if .sitePage.SiteLogo}}{{.sitePage.SiteLogo}}{{else}}/assets/static/nav-001/img/icon.png{{end}}" />

<!-- 静态文件引用 -->
	<link rel="icon" href="/assets/static/nav-001/img/icon.png" type="image/png">
	<link rel="preload" href="/assets/static/nav-001/css/bootstrap.min.css" as="style">
	<link rel="stylesheet" href="/assets/static/nav-001/css/bootstrap.min.css">
	<link rel="stylesheet" href="/assets/static/nav-001/css/site.css">
	<script>
		(function(){try{var t=localStorage.getItem('fby-theme')||'light';document.documentElement.dataset.theme=t;document.documentElement.dataset.bsTheme=t;document.documentElement.classList.toggle('dark',t==='dark');}catch(e){}})();
	</script>
</head>
<body>

{{end}}
